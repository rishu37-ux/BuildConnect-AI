[project]
name = "buildconnect-scraper"
version = "0.1.0"
description = "Agentic lead discovery for architects, structural engineers and contractors in Punjab & Himachal Pradesh"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
buildconnect-scrape = "buildconnect_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["buildconnect_scraper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
